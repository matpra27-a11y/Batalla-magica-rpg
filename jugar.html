<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Batalla Mágica</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f1a0f"><link rel="apple-touch-icon" href="icon-192.png">
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});</script>
<style>body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1a0f;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:20px;box-sizing:border-box}a{color:#ffd77a}</style>
</head><body><div id="s">⚔️ Cargando Batalla Mágica…</div>
<script>
(async () => {
  const s = document.getElementById('s');
  try {
    const get = (u, req) => fetch(u).then(r => { if (!r.ok) { if (req) throw new Error(u + ' (' + r.status + ')'); return ''; } return r.text(); }).catch(e => { if (req) throw e; return ''; });
    let [html, mods, cfg, extra, rpg] = await Promise.all([get('index.html', 1), get('mods.js', 1), get('config.js', 0), get('extra.js', 0), get('rpg.js', 0)]);
    const rep = (a, b) => { if (!html.includes(a)) { console.warn('parche no aplicado:', a.slice(0, 50)); return; } html = html.replace(a, () => b); };
    const inline = (cfg + '\n' + mods + '\n' + extra + '\n' + rpg).replace(/<\/script/gi, '<\\/script');
    rep('</head>', '<script>' + inline + '<\/script></head>');
    // ganchos del mundo / optimización (corren antes de armar el bosque)
    rep('spawnPortal(); loadPack();',
      "try{window.__G={THREE,scene,renderer,camera,sun,me,queue,instance,colliders,pathSegs,blocked,mulberry32,TOUCH,PORTAL,remotes,circleTex,addRing,addGlow,EL,hurt,addCircle,addBeam,sparks,labelSprite,iconSprite,monsters,loader,sfx,alertMsg,spawnPortal,hitMe,spawnMonster,MON,joinRoom:c=>{me.name=myName();if(lobbyMq){try{lobbyMq.end(true)}catch(e){}lobbyMq=null}say('Conectando al mundo '+c+'…');connectGame(c)},showPreview,setSel:v=>{sel=v;renderSel();},get mq(){return mq},get srv(){return srv},NS,get rid(){return rid}};window.__MODS&&window.__MODS.pre(window.__G);}catch(e){console.warn('mods',e)} spawnPortal(); loadPack();");
    rep('packState = 2; buildForest();', "packState = 2; buildForest(); try{window.__MODS&&window.__MODS.post(window.__G)}catch(e){console.warn('mods',e)}");
    // el portal vuelve a aparecer 5 minutos después de explotar (y ya no a los 40 s de la victoria)
    rep('scene.remove(portal.g); portal = null; wave.active = true;',
      "scene.remove(portal.g); portal = null; clearTimeout(window.__pt); window.__pt = setTimeout(() => { spawnPortal(); try { alertMsg('🌀 ¡El portal reapareció!', 'Volvé al final del camino del sur', 3200); } catch (e) {} }, 300000); wave.active = true;");
    rep('setTimeout(spawnPortal, 40000);', '/* el portal reaparece cada 5 min */');
    // límites del mapa más amplios para llegar a la aldea de runas
    rep('me.x = Math.max(-WORLD, Math.min(WORLD, me.x)); me.z = Math.max(-WORLD, Math.min(ZMAX, me.z));', 'if (window.__isl) { const I = window.__isl, dx = me.x - I.x, dz = me.z - I.z, d = Math.hypot(dx, dz); if (d > I.r) { me.x = I.x + dx / d * I.r; me.z = I.z + dz / d * I.r; } } else { me.x = Math.max(-200, Math.min(200, me.x)); me.z = Math.max(-200, Math.min(200, me.z)); }');

    // --- v2: menú, vuelo, personajes especiales ---
    rep("const snap = () => ({ x: +me.x.toFixed(2),", "const snap = () => ({ w: window.__sword | 0, h: window.__halo ? 1 : 0, y: +(me.y || 0).toFixed(1), x: +me.x.toFixed(2),");
    rep('r.tx = s.x; r.tz = s.z;', 'r.tx = s.x; r.tz = s.z; r.ty = +s.y || 0; r.halo = s.h | 0; r.sw = s.w | 0;');
    rep('p.x += (r.tx - p.x) * t; p.z += (r.tz - p.z) * t;', 'p.x += (r.tx - p.x) * t; p.z += (r.tz - p.z) * t; p.y += ((r.ty || 0) - p.y) * t;');
    rep('me.avatar.position.set(me.x, 0, me.z);', 'me.avatar.position.set(me.x, me.y || 0, me.z);');
    rep('camera.position.set(me.x + fx0 * ez, ey, me.z + fz0 * ez);', 'camera.position.set(me.x + fx0 * ez, ey + (me.y || 0), me.z + fz0 * ez);');
    rep('Math.max(0.5, ty - Math.sin(p) * d), me.z', 'Math.max(0.5, (me.y || 0) + ty - Math.sin(p) * d), me.z');
    rep('camera.lookAt(me.x, ty, me.z);', 'camera.lookAt(me.x, ty + (me.y || 0), me.z);');
    rep('function pick(k) { if (!EL[k]) return;', "function pick(k) { if (!EL[k]) return; if (k === 'sagrado' && !([3, 6, 7].includes(me.c) && window.__bm && window.__bm.getUser() && window.__bm.getUser().is_admin)) return alertMsg('✨ Sagrado', 'Sólo el Serafín (admin)', 1500);");
    rep("function hitMe(d) { sfx('sword', 0.6); me.hp = Math.max(0, me.hp - d);", "function hitMe(d) { d = Math.max(1, Math.round(d * (window.__shieldK ? window.__shieldK() : 1) * (window.__defK ? window.__defK() : 1))); sfx('sword', 0.6); me.hp = Math.max(0, me.hp - d);");
    rep('function makeAvatar(name, ci, local) {', 'function makeAvatar(name, ci, local) { if (window.__MODS && window.__MODS.makeCustom) { const c = window.__MODS.makeCustom(name, ci, local); if (c) return c; }');
    rep("camera.position.set(Math.sin(a) * 4.2, 1.5, 14 + Math.cos(a) * 4.2); camera.lookAt(0, 1.0, 14);\n    if (innerWidth > innerHeight) camera.translateX(2.0); else camera.translateY(-1.5);",
        "if (!(window.__MODS && window.__MODS.menuCam && window.__MODS.menuCam(camera, t, dt, preview))) { camera.position.set(Math.sin(a) * 4.2, 1.5, 14 + Math.cos(a) * 4.2); camera.lookAt(0, 1.0, 14);\n    if (innerWidth > innerHeight) camera.translateX(2.0); else camera.translateY(-1.5); }");

    // --- v2.1: elfo + dragón ---
    rep("const CLASSES = ['Goblin mago', 'Gnomo mago', 'Domador de dragones'];", "const CLASSES = ['Goblin mago', 'Gnomo mago', 'Domador de dragones', 'Ángel de catedral', 'Campesino', 'Campesino', 'Serafín de anillos', 'Serafín de ocho alas'];");
    rep('const charP = [];', "CHARS[3] = { file: '../char_angel', h: 2.1, eyeY: 1.85, eyeZ: 0.1, cut: 1.66, tip: 'RightHand', tipOff: 0.3 }; CHARS[4] = { file: '../char_campesino1', h: 1.77, eyeY: 1.62, eyeZ: 0.08, cut: 1.5, tip: 'Hand_R', tipOff: 0.15 }; CHARS[5] = { file: '../char_campesino2', h: 1.77, eyeY: 1.62, eyeZ: 0.08, cut: 1.5, tip: 'Hand_R', tipOff: 0.15 }; CHARS[6] = CHARS[0]; CHARS[7] = CHARS[0];\nconst charP = [];");
    rep("if (!o.isSkinnedMesh || o.name !== 'body') return;", "if (!o.isSkinnedMesh || (o.name !== 'body' && o.name !== 'char1' && o.name !== 'elf')) return;");
    rep('for (const c of gl.animations) acts[c.name] = mixer.clipAction(c);', "for (const c of gl.animations) acts[c.name] = mixer.clipAction(c); if (!acts.Walk && acts.walk) { acts.Walk = acts.walk; acts.Run = acts.run || acts.walk; try { const tr = []; m.traverse(o => { if (o.isBone) { const p = o.position.toArray(), q = o.quaternion.toArray(); tr.push(new THREE.VectorKeyframeTrack(o.name + '.position', [0, 1], [...p, ...p]), new THREE.QuaternionKeyframeTrack(o.name + '.quaternion', [0, 1], [...q, ...q])); } }); acts.Idle = mixer.clipAction(new THREE.AnimationClip('Idle', 1, tr)); } catch (e) {} }");
    rep('function castSpell() {', 'function castSpell() { if (window.__castHook && window.__castHook()) return;');
    // RPG: daño, experiencia, velocidad, 10 jugadores
    rep('function hurt(m, d, st = []) {\n  if (m.dead) return;', 'function hurt(m, d, st = []) {\n  if (m.dead) return; d *= (window.__dmgK ? window.__dmgK() : 1);');
    rep("m.dead = true; m.g.remove(m.bar.s); mplay(m, 'death');", "m.dead = true; m.g.remove(m.bar.s); mplay(m, 'death'); try { window.__onKill && window.__onKill(m); } catch (e) {}");
    rep("$('hpTxt').textContent = 'Vida ' + me.hp;", "{ const mh = window.__maxHp ? window.__maxHp() : 100; $('hpTxt').textContent = 'Vida ' + Math.round(me.hp * mh / 100) + '/' + mh; }");
    rep("$('enTxt').textContent = 'Energía ' + e;", "{ const mn = window.__maxEn ? window.__maxEn() : 100; $('enTxt').textContent = 'Energía ' + Math.round(e * mn / 100) + '/' + mn; }");
    rep('scene.add(ground);', 'ground.material.polygonOffset = true; ground.material.polygonOffsetFactor = 6; ground.material.polygonOffsetUnits = 6; scene.add(ground);');
    rep('new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 400)', 'new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.3, 400)');
    rep('spd = (run ? 8 : 5.5) * mag;', 'spd = (run ? 8 : 5.5) * mag * (window.__spdK ? window.__spdK() : 1);');
    rep('const MAXP = 8, NS', 'const MAXP = 10, NS');
    // muerte en la isla del cielo
    rep('me.x = 0; me.z = 14; me.hp = 100; me.en = 100; } }', 'me.x = 0; me.z = 14; me.hp = 100; me.en = 100; try { window.__onDeath && window.__onDeath(); } catch (e) {} } }');
    // PWA
    rep('</head>', '<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f1a0f"><meta name="mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon-192.png"></head>');
    document.open(); document.write(html); document.close();
    try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js'); } catch (e) {}
  } catch (e) {
    s.innerHTML = '⚠️ No se pudo cargar: ' + String(e.message).replace(/</g, '&lt;') + '<br><br>Revisá que <b>index.html</b>, <b>mods.js</b> y <b>config.js</b> estén subidos en el mismo lugar.<br><a href="index.html">Abrir la versión original</a>';
  }
})();
</script></body></html>
